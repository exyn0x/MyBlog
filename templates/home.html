<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Blog</title>
</head>
<body>
    {% if posts %}
        {% for post in posts %}
            <a href="{% url 'get-post' post.id %}">
                <h1><i>{{ post.title }}</i></h1>
            </a>
            <h3>{{ post.content }}</h3>
            <p>{{ post.created_at }}</p>
            <br>
        {% endfor %}
    {% else %}
        <div>
            <h1>No Content...</h1>
        </div>
    {% endif %}
</body>
</html>
